<div class="compliance-card">
  <div class="card-header">
    <div class="header-left">
      <h2 class="section-title">Compliance Health Trend</h2>
      <span class="score-badge">{{ currentScore }} / 100</span>
    </div>
    <a routerLink="/supplier/compliance" class="link-details">View Details →</a>
  </div>

  <div class="chart-container" *ngIf="history && history.length > 0; else emptyChart">
    <svg viewBox="0 0 320 170" class="trend-svg" preserveAspectRatio="xMidYMid meet">
      <!-- Grid lines -->
      <line x1="35" y1="20" x2="300" y2="20" stroke="#F2F4F7" stroke-dasharray="3 3"/>
      <text x="10" y="24" fill="#98A2B3" font-size="10" font-family="Inter, sans-serif">100</text>

      <line x1="35" y1="50" x2="300" y2="50" stroke="#F2F4F7" stroke-dasharray="3 3"/>
      <text x="14" y="54" fill="#98A2B3" font-size="10" font-family="Inter, sans-serif">90</text>

      <line x1="35" y1="80" x2="300" y2="80" stroke="#F2F4F7" stroke-dasharray="3 3"/>
      <text x="14" y="84" fill="#98A2B3" font-size="10" font-family="Inter, sans-serif">80</text>

      <line x1="35" y1="110" x2="300" y2="110" stroke="#F2F4F7" stroke-dasharray="3 3"/>
      <text x="14" y="114" fill="#98A2B3" font-size="10" font-family="Inter, sans-serif">70</text>

      <line x1="35" y1="140" x2="300" y2="140" stroke="#E4E7EC"/>
      <text x="14" y="144" fill="#98A2B3" font-size="10" font-family="Inter, sans-serif">60</text>

      <!-- Sparkline path -->
      <path [attr.d]="pathD" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Data points -->
      <g *ngFor="let pt of history; let i = index">
        <circle [attr.cx]="getX(i)" [attr.cy]="getY(pt.score)" r="4" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2"/>
        <text [attr.x]="getX(i)" y="160" text-anchor="middle" fill="#667085" font-size="11" font-weight="500" font-family="Inter, sans-serif">
          {{ pt.month }}
        </text>
      </g>
    </svg>
  </div>

  <ng-template #emptyChart>
    <div class="empty-chart-state">
      <p class="empty-msg">No historical compliance data yet.</p>
    </div>
  </ng-template>
</div>
