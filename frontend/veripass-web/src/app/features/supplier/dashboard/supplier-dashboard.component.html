<div class="dashboard-page-container">
  <!-- 1. DASHBOARD HEADER -->
  <header class="dashboard-header">
    <div class="header-titles">
      <h1 class="page-title">Business Dashboard</h1>
      <p class="page-subtitle">
        Monitor your business identity, verification status and compliance health.
      </p>
    </div>
    <div class="header-actions">
      <a routerLink="/supplier/passport" class="btn btn-secondary">
        View Business Passport
      </a>
      <a routerLink="/supplier/passport/share" class="btn btn-primary">
        Share Passport →
      </a>
    </div>
  </header>

  <!-- ERROR BANNER -->
  <div class="error-banner" *ngIf="errorMessage()">
    <div class="error-icon">⚠</div>
    <div class="error-content">
      <strong>Unable to retrieve verification status</strong>
      <p>{{ errorMessage() }}</p>
    </div>
    <button class="btn btn-secondary btn-sm" (click)="loadData()">Try Again</button>
  </div>

  <!-- SKELETON LOADER -->
  <div class="skeleton-wrapper" *ngIf="loading()">
    <div class="skeleton-hero">
      <div class="skeleton-line line-title"></div>
      <div class="skeleton-line line-sub"></div>
      <div class="skeleton-bar"></div>
    </div>
    <div class="skeleton-grid">
      <div class="skeleton-card" *ngFor="let i of [1, 2, 3, 4]"></div>
    </div>
  </div>

  <!-- LOADED DASHBOARD CONTENT -->
  <div class="dashboard-content" *ngIf="!loading()">
    <!-- 2. BUSINESS STATUS HERO -->
    <app-business-status-hero
      [businessName]="businessName"
      [gstin]="gstin"
      [cin]="cin"
      [verificationStatus]="verificationStatus"
      [verificationScore]="verificationScore">
    </app-business-status-hero>

    <!-- 3. CORE METRICS GRID -->
    <app-core-metrics-grid
      [verificationScore]="verificationScore"
      [complianceScore]="complianceScore"
      [totalCredentials]="totalCredentials"
      [verifiedCredentials]="verifiedCredentials"
      [buyerRequestsCount]="businessService.totalBuyerRequestsCount()"
      [pendingRequestsCount]="businessService.pendingBuyerRequestsCount()">
    </app-core-metrics-grid>

    <!-- 4. 2-COLUMN MAIN SPLIT -->
    <div class="dashboard-two-col-layout">
      <!-- LEFT PRIMARY COLUMN -->
      <div class="layout-col-primary">
        <!-- Action Required Section -->
        <app-action-required-list [items]="actionRequiredItems"></app-action-required-list>

        <!-- Verification Overview -->
        <app-verification-overview [checks]="verificationChecks"></app-verification-overview>

        <!-- Recent Activity Audit Timeline -->
        <app-recent-activity-timeline
          [activities]="recentActivities">
        </app-recent-activity-timeline>
      </div>

      <!-- RIGHT SECONDARY COLUMN -->
      <div class="layout-col-secondary">
        <!-- Passport Quick Access -->
        <app-passport-quick-access
          [passportId]="passportId"
          [companyName]="businessName"
          [trustScore]="verificationScore"
          [isVerified]="verificationStatus === 'VERIFIED'"
          [verifiedPills]="verifiedPills">
        </app-passport-quick-access>

        <!-- Compliance Health Trend -->
        <app-compliance-health
          [currentScore]="complianceScore">
        </app-compliance-health>

        <!-- Upcoming Expirations -->
        <app-upcoming-expirations></app-upcoming-expirations>
      </div>
    </div>
  </div>
</div>
