    <div class="buyer-login-container">
      <div class="buyer-login-box">
        <!-- Logo Header -->
        <div class="login-header">
          <a routerLink="/" class="auth-brand">
            <svg viewBox="0 0 24 24" fill="none" class="brand-shield">
              <path d="M12 2L4 6V11.5C4 16.5 7.4 21.1 12 22C16.6 21.1 20 16.5 20 11.5V6L12 2Z" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5"/>
              <path d="M9 11.5L11 13.5L15.5 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="brand-text">VERIPASS</span>
          </a>
          <h2 class="login-title">Sign in to your organization</h2>
          <p class="login-subtitle">Procurement Intelligence & Enterprise Vendor Risk</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
          <div *ngIf="errorMessage()" style="margin-bottom: 16px; padding: 12px; background: #FEF2F2; border: 1px solid #FCA5A5; color: #DC2626; border-radius: 8px; font-size: 13px;">
            {{ errorMessage() }}
          </div>
          <form (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
              <label class="form-label">Work Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="you@company.com"
                [(ngModel)]="email"
                name="email"
                required />
            </div>

            <div class="form-group">
              <div class="label-row">
                <label class="form-label">Password</label>
                <a routerLink="/help" class="forgot-link">Forgot password?</a>
              </div>
              <div class="pwd-box">
                <input
                  [type]="showPassword() ? 'text' : 'password'"
                  class="form-control"
                  placeholder="Enter organization password"
                  [(ngModel)]="password"
                  name="password"
                  required />
                <button type="button" class="pwd-eye-btn" (click)="togglePassword()">
                  {{ showPassword() ? '👁️' : '👁️‍🗨️' }}
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-box">
                <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
                <span>Remember this device</span>
              </label>
            </div>

            <button type="submit" class="btn-signin" [disabled]="loading()">
              <span *ngIf="!loading()">Sign In</span>
              <span *ngIf="loading()">Authenticating with SSO...</span>
            </button>
          </form>

          <div class="security-badge-footer">
            <span class="lock-icon">🔒</span>
            <span>Protected by Veripass Enterprise Security &amp; 256-bit Encryption</span>
          </div>

          <div class="login-switch-footer">
            <span>New organization? </span>
            <a routerLink="/buyer/register">Create account</a>
            <span class="divider">&bull;</span>
            <a routerLink="/auth/login">Supplier Login</a>
          </div>
        </div>
      </div>
    </div>
